    <!--
      Catat kunjungan SECEPAT MUNGKIN, sebelum Tailwind & bundle JS didownload.
      Kalau nunggu React kelar, pengunjung yang buka terus langsung balik (umum dari TikTok)
      gak bakal kehitung. Logikanya sama persis kayak src/lib/track.ts (key storage juga sama).
    -->
    <script>
      (function () {
        var URL = "%VITE_SUPABASE_URL%", KEY = "%VITE_SUPABASE_ANON_KEY%";
        if (!URL || URL.charAt(0) === "%" || !KEY || KEY.charAt(0) === "%") return;
        function get(s, k) { try { return window[s].getItem(k); } catch (e) { return null; } }
        function set(s, k, v) { try { window[s].setItem(k, v); } catch (e) {} }
        function id() { try { return crypto.randomUUID(); } catch (e) { return Math.random().toString(36).slice(2) + Date.now().toString(36); } }
        function keep(s, k) { var v = get(s, k); if (!v) { v = id(); set(s, k, v); } return v; }
        if (get("localStorage", "vintec_ignore_me") === "1") { window.__vintecView = true; return; }

        var ua = navigator.userAgent, ref = document.referrer, src = get("sessionStorage", "vintec_src");
        if (!src) {
          var utm = new URLSearchParams(location.search).get("utm_source");
          if (utm) src = utm.toLowerCase().slice(0, 40);
          else if (/musical_ly|Bytedance|TikTok/i.test(ua)) src = "tiktok";
          else if (/Instagram/i.test(ua)) src = "instagram";
          else if (/FBAN|FBAV|FB_IAB/i.test(ua)) src = "facebook";
          else if (/WhatsApp/i.test(ua)) src = "whatsapp";
          else if (ref) {
            try {
              var h = new window.URL(ref).hostname.replace(/^www\.|^m\.|^l\./, "");
              src = h === location.hostname ? "langsung"
                : /tiktok/.test(h) ? "tiktok" : /instagram/.test(h) ? "instagram"
                : /facebook/.test(h) ? "facebook" : (/youtube/.test(h) || h === "youtu.be") ? "youtube"
                : /google/.test(h) ? "google" : /whatsapp/.test(h) ? "whatsapp" : h.slice(0, 40);
            } catch (e) { src = "langsung"; }
          } else src = "langsung";
          set("sessionStorage", "vintec_src", src);
        }

        var body = JSON.stringify({
          type: "view",
          visitor_id: keep("localStorage", "vintec_vid"),
          session_id: keep("sessionStorage", "vintec_sid"),
          source: src,
          referrer: ref ? ref.slice(0, 300) : null,
          device: /iPad|Tablet/i.test(ua) ? "tablet" : /Mobi|Android|iPhone/i.test(ua) ? "mobile" : "desktop",
          path: location.pathname.slice(0, 200)
        });
        try {
          fetch(URL + "/rest/v1/events", {
            method: "POST", keepalive: true, body: body,
            headers: { apikey: KEY, Authorization: "Bearer " + KEY, "Content-Type": "application/json", Prefer: "return=minimal" }
          }).catch(function () {});
          window.__vintecView = true;
        } catch (e) {}
      })();
    </script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                        apple: ['-apple-system', 'BlinkMacSystemFont', '"SF Pro Text"', '"SF Pro Display"', '"Helvetica Neue"', 'Arial', 'sans-serif'],
                    },
                    keyframes: {
                        'glow-pulse': {
                            '0%, 100%': { opacity: '0.4', transform: 'scale(1)' },
                            '50%': { opacity: '0.7', transform: 'scale(1.1)' },
                        },
                        'shimmer': {
                            '0%': { transform: 'translateX(-100%)' },
                            '100%': { transform: 'translateX(100%)' }
                        },
                        'border-glow': {
                            '0%, 100%': { 'border-color': 'rgba(59, 130, 246, 0.4)', 'box-shadow': '0 0 10px rgba(59, 130, 246, 0.2)' },
                            '50%': { 'border-color': 'rgba(59, 130, 246, 0.8)', 'box-shadow': '0 0 25px rgba(59, 130, 246, 0.6)' }
                        },
                        'scroll-code': {
                            '0%': { transform: 'translateY(0)' },
                            '100%': { transform: 'translateY(-50%)' }
                        },
                        'float': {
                            '0%, 100%': { transform: 'translateY(0) rotate(0deg)' },
                            '50%': { transform: 'translateY(-18px) rotate(4deg)' }
                        },
                        'label-in': {
                            '0%': { opacity: '0', transform: 'translateY(4px)' },
                            '100%': { opacity: '1', transform: 'translateY(0)' }
                        }
                    },
                    animation: {
                        'glow-pulse': 'glow-pulse 4s ease-in-out infinite',
                        'shimmer': 'shimmer 2.5s infinite linear',
                        'active-glow': 'border-glow 1s ease-in-out infinite',
                        'scroll-code': 'scroll-code 40s linear infinite',
                        'float': 'float 4.5s ease-in-out infinite',
                        'label-in': 'label-in 0.25s ease-out'
                    }
                }
            }
        }
    </script>

    <style>
        body {
            font-family: 'Inter', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }
        .glass-card {
            background: rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(0, 0, 0, 0.05);
        }
        .dark .glass-card {
            background: rgba(15, 23, 42, 0.7);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        
        .highlight-glow {
            position: relative;
        }
        .highlight-glow::before {
            content: '';
            position: absolute;
            inset: -2px;
            background: linear-gradient(45deg, #3b82f6, #60a5fa, #3b82f6);
            background-size: 400%;
            z-index: -1;
            filter: blur(8px);
            border-radius: 20px;
            animation: move-glow 8s linear infinite;
            opacity: 0.6;
        }
        .dark .highlight-glow::before {
            background: linear-gradient(45deg, #1e40af, #3b82f6, #1e40af);
            filter: blur(12px);
            opacity: 0.8;
        }
        @keyframes move-glow {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .active-hold-glow:active {
            border-color: #3b82f6 !important;
            box-shadow: 0 0 25px rgba(59, 130, 246, 0.4), inset 0 0 10px rgba(59, 130, 246, 0.2) !important;
        }
        .dark .active-hold-glow:active {
            box-shadow: 0 0 35px rgba(59, 130, 246, 0.9), inset 0 0 15px rgba(59, 130, 246, 0.5) !important;
        }

        .code-animation-overlay {
            mask-image: linear-gradient(to bottom, transparent, black 15%, black 85%, transparent);
            -webkit-mask-image: linear-gradient(to bottom, transparent, black 15%, black 85%, transparent);
        }
        .font-mono, code, kbd {
            font-family: 'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, monospace;
        }
    </style>
